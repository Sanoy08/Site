<!-- public/offline.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>No Internet</title>
    
    <script type="module" src="dotlottie-player.mjs"></script>
    
    <style>
        body {
            background-color: #F8F9FA;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            user-select: none;
        }
        .anim-container {
            width: 280px;
            height: 280px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #1e293b;
        }
        p {
            font-size: 15px;
            color: #64748b;
            margin: 0 0 35px 0;
            max-width: 80%;
            line-height: 1.5;
        }
        button {
            background-color: #6a9c27; /* তোমার ব্র্যান্ড কালার */
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(106, 156, 39, 0.3);
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="anim-container">
        <dotlottie-player 
            src="No_Internet.lottie" 
            background="transparent" 
            speed="1" 
            style="width: 100%; height: 100%;" 
            loop 
            autoplay>
        </dotlottie-player>
    </div>
    
    <h1>No Internet Connection</h1>
    <p>Please check your wifi or mobile data connection and try again.</p>
    
    <button onclick="window.location.reload()">Try Again</button>

    <script>
        // নেট কানেকশন ফিরে এলেই নিজে নিজে রিলোড হয়ে যাবে!
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
